<div class="experience-list">
  {% for position in site.data.experience %}
  <div class="experience-row">
    <div class="experience-date">{{ position.dates }}</div>
    <div>
      <h3>{{ position.role }}</h3>
      <p>{{ position.team }} <span class="separator">·</span> {{ position.location }}</p>
    </div>
  </div>
  {% endfor %}
</div>
